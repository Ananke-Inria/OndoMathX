[[bench]]
name = "tet_15"
harness = false

[[bench]]
name = "tet_10"
harness = false

[[bench]]
name = "tet_10_4"
harness = false

[[bench]]
name = "tet_10_5"
harness = false

[[bench]]
name = "tet_15_10b"
harness = false

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
nalgebra = "0.33"
