[package]
name = "ondomathx-tetrix"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "TetriX"
path = "src/main.rs"

[[bin]]
name = "gen_mat_10_4"
path = "src/bin/gen_mat_10_4.rs"

[[bin]]
name = "gen_mat_10_5"
path = "src/bin/gen_mat_10_5.rs"

[[bin]]
name = "gen_mat_15_14"
path = "src/bin/gen_mat_15_14.rs"

[[bin]]
name = "gen_mat_10b"
path = "src/bin/gen_mat_10b.rs"


[[bench]]
name = "tet_15_14"
harness = false


[[bench]]
name = "tet_10"
harness = false

[[bench]]
name = "tet_10_4"
harness = false

[[bench]]
name = "tet_10_5"
harness = false

[[bench]]
name = "tet_15_10b"
harness = false

[[bench]]
name = "tetrix_p2_space"
harness = false

[dependencies]
ondomathx-mesh = { path = "../ondomathx-mesh", version = "0.1.0" }
nalgebra = "0.33"
rayon = "1"
sprs = "0.11"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
nalgebra = "0.33"
nalgebra-sparse = "0.10"
sprs = "0.11"
