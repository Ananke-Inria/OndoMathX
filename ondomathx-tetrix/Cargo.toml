[package]
name = "ondomathx-tetrix"
version = "0.3.0"
description = "Finite elements on tetrahedral meshes: elements with 4 to 15 nodes, a P2 space with duplicated storage, VTK and Vizir output."
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["finite-element", "tetrahedron", "wave-equation", "simulation"]
categories = ["mathematics", "science", "simulation"]


# Code generators of the hard-coded tables of element/ (developer
# tools, not installed): cargo run --example gen_mat_10_4, ….
[[example]]
name = "gen_mat_10_4"
path = "tools/gen_mat_10_4.rs"

[[example]]
name = "gen_mat_10_5"
path = "tools/gen_mat_10_5.rs"

[[example]]
name = "gen_mat_15_14"
path = "tools/gen_mat_15_14.rs"

[[example]]
name = "gen_mat_10b"
path = "tools/gen_mat_10b.rs"

[[bench]]
name = "tet_15_14"
harness = false


[[bench]]
name = "tet_10"
harness = false

[[bench]]
name = "tet_10_4"
harness = false

[[bench]]
name = "tet_10_5"
harness = false

[[bench]]
name = "tet_15_10b"
harness = false

[[bench]]
name = "p2_plus"
harness = false

[dependencies]
ondomathx-mesh = { path = "../ondomathx-mesh", version = "0.1.0" }
ondomathx-toolbox = { path = "../ondomathx-toolbox", version = "0.1.2" }
nalgebra = "0.34"
rayon = "1"
sprs = "0.11"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
nalgebra = "0.34"
nalgebra-sparse = "0.11"
sprs = "0.11"
