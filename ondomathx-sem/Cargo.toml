[package]
name = "ondomathx-sem"
version = "0.2.0"
description = "Matrix-free spectral elements on quadrangle and hexahedron meshes."
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["spectral-element", "finite-element", "matrix-free", "wave-equation", "gauss-lobatto"]
categories = ["mathematics", "science", "simulation"]

[dependencies]
# ondomathx-mesh: same workspace (path + version, for publishing).
# lobatto: from crates.io (repository Ananke-Inria/Lobatto).
ondomathx-mesh = { path = "../ondomathx-mesh", version = "0.1.0" }
# Shared tools (linear algebra, signals) of the workspace.
ondomathx-toolbox = { path = "../ondomathx-toolbox", version = "0.1.1" }
lobatto = "0.1.4"
nalgebra = "0.34"
rayon = "1"
