[package]
name = "ondomathx-toolbox"
version = "0.1.1"
description = "Shared tools of the OndoMathX crates."
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["finite-element", "numerics"]
categories = ["mathematics", "science", "simulation"]

[features]
# Tools that need meshes (test meshes, I/O on a mesh).
mesh = ["dep:ondomathx-mesh"]

[dependencies]
ondomathx-mesh = { path = "../ondomathx-mesh", version = "0.1.0", optional = true }
rayon = "1"

# The D4 benchmark (mass model) runs on both spaces. Path-only
# dev-dependencies: cargo drops them when the crate is published.
[dev-dependencies]
ondomathx-mesh = { path = "../ondomathx-mesh" }
ondomathx-sem = { path = "../ondomathx-sem" }
ondomathx-tetrix = { path = "../ondomathx-tetrix" }

[[bench]]
name = "d4_mass"
harness = false
