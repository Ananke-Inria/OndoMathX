[package]
name = "ondomathx-mesh"
version = "0.1.0"
description = "Meshes, geometric maps, labels and DOF numbering for the OndoMathX finite-element crates."
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mesh", "finite-element", "gmsh", "medit", "dof-numbering"]
categories = ["mathematics", "science", "simulation"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
itertools = "0.13.0"
 

 